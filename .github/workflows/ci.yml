name: Terraform CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.8.4"
  WORKING_DIR: "."

jobs:
  terraform-ci:
    name: Validar y Lint de Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      # ── 1. Checkout del repositorio ───────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # ── 2. Configurar Terraform ────────────────────────────────────
      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── 3. Verificar formato ───────────────────────────────────────
      - name: Verificar formato de Terraform
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: false

      # ── 4. Init (sin backend real) ────────────────────────────
      - name: Inicializar Terraform
        id: init
        run: terraform init -backend=false
        env:
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          AWS_DEFAULT_REGION: us-east-1

      # ── 5. Validar sintaxis ────────────────────────────────────
      - name: Validar Terraform
        id: validate
        run: terraform validate -no-color
        env:
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          AWS_DEFAULT_REGION: us-east-1

      # ── 6. Escaneo de seguridad con Checkov (extra) ─────────────────
      - name: Escaneo de seguridad con Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false
          output_format: cli
          download_external_modules: false
        continue-on-error: true

      # ── 7. Publicar resumen como comentario en PR ─────────────────────────
      - name: Publicar resumen de CI en el PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const init     = '${{ steps.init.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const checkov  = '${{ steps.checkov.outcome }}';

            const icon = s => s === 'success' ? 'OK' : (s === 'skipped' ? 'OMITIDO' : 'FALLIDO');

            const body = [
              '## Resultados de Terraform CI',
              '',
              '| Paso | Estado |',
              '|------|--------|',
              `| Formato (\`terraform fmt\`) | ${icon(fmt)} ${fmt} |`,
              `| Init (\`terraform init\`)  | ${icon(init)} ${init} |`,
              `| Validación              | ${icon(validate)} ${validate} |`,
              `| Escaneo de seguridad Checkov | ${icon(checkov)} ${checkov} |`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });