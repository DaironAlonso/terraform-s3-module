name: Terraform CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.8.4"
  WORKING_DIR: "."

jobs:
  terraform-ci:
    name: Validate & Lint Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Terraform ────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── 3. Format check ───────────────────────────────────────
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: false

      # ── 4. Init (sin backend real) ────────────────────────────
      - name: Terraform Init
        id: init
        run: terraform init -backend=false
        env:
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          AWS_DEFAULT_REGION: us-east-1

      # ── 5. Validate syntax ────────────────────────────────────
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        env:
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          AWS_DEFAULT_REGION: us-east-1

      # ── 6. Security scan with Checkov (bonus) ─────────────────
      - name: Security Scan with Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false
          output_format: cli
          download_external_modules: false
        continue-on-error: true

      # ── 7. Post summary as PR comment ─────────────────────────
      - name: Post CI Summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const init     = '${{ steps.init.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const checkov  = '${{ steps.checkov.outcome }}';

            const icon = s => s === 'success' ? 'OK' : (s === 'skipped' ? 'SKIPPED' : 'FAILED');

            const body = [
              '## Terraform CI Results',
              '',
              '| Step | Status |',
              '|------|--------|',
              `| Format (\`terraform fmt\`) | ${icon(fmt)} ${fmt} |`,
              `| Init (\`terraform init\`)  | ${icon(init)} ${init} |`,
              `| Validate              | ${icon(validate)} ${validate} |`,
              `| Checkov security scan | ${icon(checkov)} ${checkov} |`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
